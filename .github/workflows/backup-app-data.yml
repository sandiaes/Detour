# Daily backup of the user data (the `app` schema) of the Supabase database (Phase 9; ADR 005,
# decision 5: Supabase Free has no backups). docs/backups.md explains what it covers, how to restore
# it, and how it differs from "Back up all trips" in the app.
#
# - Runs every day at 02:17 UTC and by hand (Actions -> "Back up app data" -> Run workflow).
#   Scheduled runs start only from the default branch: merge this file to main first.
# - Needs the repository secret DETOUR_IMPORT_DATABASE_URL (the Supabase session pooler string,
#   port 5432, the same one the region import uses).
# - Optional secret DETOUR_BACKUP_PASSPHRASE: when set, the dump is encrypted (AES-256, gpg) before
#   it is uploaded; keep the passphrase in a password manager, it is needed to restore.
# - Keeps each backup as a workflow artifact for 30 days. Nothing else leaves the runner.
# - The daily connection also counts as activity for Supabase, which pauses a Free project after a
#   week without any.
# - `geo` is not backed up: the import workflow rebuilds it. Documents on the phone are not in the
#   database and are not covered (use "Back up all trips" in the app for those).
name: Back up app data

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-app-data
  cancel-in-progress: false

jobs:
  backup:
    name: Dump the app schema
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DUMP_URL: ${{ secrets.DETOUR_IMPORT_DATABASE_URL }}
      PASSPHRASE: ${{ secrets.DETOUR_BACKUP_PASSPHRASE }}
      # The client must not be older than the server: Supabase runs PostgreSQL 17.
      PG_IMAGE: postgres:17
    steps:
      - name: Check the database secret
        run: |
          if [ -z "$DUMP_URL" ]; then
            echo "::error::Repository secret DETOUR_IMPORT_DATABASE_URL is not set (docs/backups.md)"
            exit 1
          fi
          case "$DUMP_URL" in
            *:6543/*) echo "::error::Use the session pooler (port 5432), not 6543"; exit 1 ;;
          esac
      - name: Dump
        run: |
          set -euo pipefail
          mkdir -p out
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          # The connection string goes in as an environment variable, never on a command line
          # that the log could show.
          docker run --rm -e DUMP_URL -v "$PWD/out:/out" "$PG_IMAGE" sh -ec '
            pg_dump "$DUMP_URL" --schema=app --format=custom --no-owner --no-privileges \
              --file=/out/app.dump
            psql "$DUMP_URL" -At -c "SELECT version_num FROM public.alembic_version" \
              > /out/schema-version.txt
            psql "$DUMP_URL" -At -F " " -c "
              SELECT relname, n_live_tup FROM pg_stat_user_tables
              WHERE schemaname = '"'"'app'"'"' ORDER BY relname" > /out/row-counts.txt
            pg_restore --list /out/app.dump > /dev/null
          '
          echo "Schema version: $(cat out/schema-version.txt)"
          echo "Dump size: $(stat -c %s out/app.dump) bytes"
          {
            echo "### App data backup $stamp"
            echo
            echo "Schema version \`$(cat out/schema-version.txt)\`, dump $(stat -c %s out/app.dump) bytes."
            echo
            echo '```'
            cat out/row-counts.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Encrypt
        run: |
          set -euo pipefail
          if [ -n "$PASSPHRASE" ]; then
            printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --symmetric --cipher-algo AES256 \
              --output out/app.dump.gpg out/app.dump
            rm out/app.dump
            echo "Encrypted with DETOUR_BACKUP_PASSPHRASE." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::DETOUR_BACKUP_PASSPHRASE is not set: the backup is stored unencrypted (visible to the repository's collaborators). docs/backups.md"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-backup-${{ env.STAMP }}
          path: out/
          retention-days: 30
          if-no-files-found: error
