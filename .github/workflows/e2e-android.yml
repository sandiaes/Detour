# End-to-end test on an Android emulator against a seeded backend (Phase 5).
#
# 1. Postgres/PostGIS service; the fixture region is imported with the real import commands
#    (services/api/tests/e2e_seed.py: invented data, nothing real).
# 2. The API runs on the runner with routing and Photon switched OFF, so no community server is
#    called (CLAUDE.md): every transfer is a labelled estimate.
# 3. A release-variant x86_64 APK is built with DETOUR_E2E=1, which only allows plain HTTP to
#    http://10.0.2.2:8000 (the runner as seen from the emulator).
# 4. Maestro (a test tool, not an app dependency) runs apps/mobile/e2e/trip-flow.yaml.
#
# Expensive (APK build about 14 minutes plus the emulator), so it runs on pull requests that touch
# the app, the API or this file, on pushes to main, and by hand.
name: E2E Android

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "services/api/**"
      - ".github/workflows/e2e-android.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned. Not verified against the releases page when written (see ADR 015): if the download
  # fails, set the current cli-x.y.z tag from https://github.com/mobile-dev-inc/maestro/releases.
  MAESTRO_VERSION: "2.8.0"

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EXPO_NO_TELEMETRY: "1"
      DETOUR_E2E: "1"
      EXPO_PUBLIC_DETOUR_API_URL: http://10.0.2.2:8000
    steps:
      - uses: actions/checkout@v4

      # ---- backend ----
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install import tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osm2pgsql osmium-tool
      - name: Install the API
        working-directory: services/api
        run: pip install -e ".[dev]"
      - name: Seed the fixture region
        working-directory: services/api
        env:
          DETOUR_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/detour
          DETOUR_STAGING_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/staging
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE detour' -c 'CREATE DATABASE staging'
          python -m tests.e2e_seed
      - name: Start the API (routing and Photon off)
        working-directory: services/api
        env:
          DETOUR_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/detour
          DETOUR_ENVIRONMENT: test
          DETOUR_ROUTING_ENABLED: "false"
          DETOUR_PHOTON_ENABLED: "false"
          DETOUR_TOKEN_SECRET: e2e-secret-with-more-than-32-characters-0123
        run: |
          nohup uvicorn detour_api.main:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/v1/health && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"; exit 1

      # ---- app ----
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate the Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build the release APK (x86_64 for the emulator)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --console=plain

      # ---- emulator ----
      # The build leaves the runner too full for the emulator's system image ("No space left on
      # device", first run). Keep the APK, then delete what is no longer needed. Never delete
      # /usr/local/lib/android: that is the Android SDK.
      - name: Free disk space
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release.apk"
          rm -rf apps/mobile/android apps/mobile/node_modules node_modules ~/.gradle ~/.npm
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
      - name: Run the flow on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # No Google apps: fewer background processes on a small CI emulator (first runs hit
          # "System UI isn't responding" with google_apis).
          target: default
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          script: bash apps/mobile/e2e/run-e2e.sh

      - name: Upload the report and the API log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-report
          path: |
            ${{ runner.temp }}/maestro-report.xml
            ${{ runner.temp }}/maestro-debug
            ${{ runner.temp }}/screen.png
            ${{ runner.temp }}/logcat.txt
            ${{ runner.temp }}/api.log
          retention-days: 7
          if-no-files-found: ignore
