# Keeps the free hosting awake (ADR 005 addendum, 2026-11-15; docs/deployment.md, "Keeping it awake").
#
# - Render Free spins a web service down after 15 minutes without inbound traffic (about one minute to
#   wake). Supabase Free may pause a project with low activity over 7 days.
# - Every 5 minutes this calls GET /v1/health/ready on the deployed API. That answers from the API
#   (traffic for Render) and runs a real query on the database (activity for Supabase).
# - Needs the repository VARIABLE DETOUR_API_URL (the same one the APK build uses, e.g.
#   https://detour-api.onrender.com, no trailing slash). Without it the run does nothing.
# - Public repository: the run logs only the HTTP status. Nothing secret is used or printed.
# - Scheduled runs start only from the default branch, can be delayed or skipped by GitHub under load,
#   and are switched off after 60 days without a commit (re-enable on the Actions page). It is
#   therefore a best effort; an external monitor can be added later (ADR 005 addendum).
# - A reachable API that reports the database as unavailable (for example a paused project) makes the
#   run fail, so the owner sees it on the Actions page.
name: Keep awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    name: Ping the API and its database
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.DETOUR_API_URL }}
    steps:
      - name: Call /v1/health/ready
        run: |
          if [ -z "$API_URL" ]; then
            echo "::notice::Repository variable DETOUR_API_URL is not set; nothing to ping."
            exit 0
          fi
          url="${API_URL%/}/v1/health/ready"
          # A sleeping service needs about a minute to wake: allow it, and try twice.
          for attempt in 1 2; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 100 --user-agent 'detour-keep-awake/1.0' "$url" || true)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::The API did not report ready (last status $code). If it answers 503, the database may be paused: restore it in the Supabase dashboard."
          exit 1
