# Phase 0, spike S5 (throwaway): heuristic versus OR-Tools on three fixture trips, run on three
# kinds of machine to test whether the plans are identical across machines.
# A push to the working branch that changes the spike runs it; otherwise run it by hand.
name: Spike S5 sequencing

on:
  push:
    branches: [claude/beautiful-archimedes-f8taqy]
    paths: [".github/workflows/spike-s5-sequencing.yml", "spikes/s5-sequencing/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install OR-Tools
        run: python -m pip install -r spikes/s5-sequencing/requirements.txt
      - name: Benchmark
        run: python -I spikes/s5-sequencing/bench.py spikes/s5-sequencing/fixtures ${{ matrix.os }} out/${{ matrix.os }}.json 3
      - uses: actions/upload-artifact@v4
        with:
          name: s5-${{ matrix.os }}
          path: out/${{ matrix.os }}.json
          retention-days: 14

  report:
    needs: bench
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: s5-*
          path: results
          merge-multiple: true
      - name: Build report
        run: |
          python3 -I spikes/s5-sequencing/report.py results/*.json > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cat report.md
      - uses: actions/upload-artifact@v4
        with:
          name: s5-report
          path: |
            report.md
            results/
          retention-days: 14
