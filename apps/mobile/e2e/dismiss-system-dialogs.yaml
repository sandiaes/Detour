# A slow CI emulator sometimes puts an Android "isn't responding" dialog (System UI, the launcher)
# over the app (the text has a typographic apostrophe, so the match avoids it). It is not an app failure: tap Wait and carry on. Does nothing when no dialog shows.
appId: io.github.sandiaes.detour
---
- runFlow:
    when:
      visible: ".*responding.*"
    commands:
      - tapOn: "Wait"
