# The one end-to-end flow (docs/development.md, "End-to-end test"): create a trip, compare the two
# proposals, select one (it becomes the trip's active itinerary and the trip's overview opens, ADR
# 021), read its days, open the map, and find the trip again in the list.
# It runs on an Android emulator against the seeded fixture backend (services/api/tests/e2e_seed.py:
# the invented city Testburg, no real map data) with routing switched off, so every transfer is a
# labelled estimate. Controls are found by testID, which React Native exposes as the resource id.
appId: io.github.sandiaes.detour
---
- launchApp:
    clearState: true
# The first screen: wait up to about 90 s, dismissing "isn't responding" dialogs of the slow
# emulator as they appear.
- repeat:
    while:
      notVisible: "No trips yet"
    times: 30
    commands:
      - runFlow: dismiss-system-dialogs.yaml
      - waitForAnimationToEnd:
          timeout: 3000
- assertVisible: "No trips yet"
- tapOn: "Plan a trip"
- tapOn:
    id: "destination-input"
- inputText: "Testburg"
- runFlow: dismiss-system-dialogs.yaml
- extendedWaitUntil:
    visible:
      id: "destination-result-900101"
    timeout: 30000
- tapOn:
    id: "destination-result-900101"
- hideKeyboard
# The form is longer than the screen: only elements on screen are visible to the test.
- scrollUntilVisible:
    element:
      id: "plan-trip"
- tapOn:
    id: "plan-trip"
- runFlow: dismiss-system-dialogs.yaml
- extendedWaitUntil:
    visible: "How they differ"
    timeout: 60000
- assertVisible: "Essentials"
- scrollUntilVisible:
    element:
      id: "select-essentials"
- tapOn:
    id: "select-essentials"
- runFlow: dismiss-system-dialogs.yaml
- extendedWaitUntil:
    visible: "Your itinerary"
    timeout: 30000
- tapOn:
    id: "open-itinerary"
- runFlow: dismiss-system-dialogs.yaml
- extendedWaitUntil:
    visible: "Day 1.*"
    timeout: 30000
- scrollUntilVisible:
    element: "Estimated"
- tapOn:
    id: "show-map"
- assertVisible: "Solid line: travel time routed"
- assertVisible: "Data from OpenStreetMap"
- back
- extendedWaitUntil:
    visible: "Your itinerary"
    timeout: 20000
- back
- extendedWaitUntil:
    visible: "Testburg, 3 days"
    timeout: 20000
- assertVisible: "Upcoming"
