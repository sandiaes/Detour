# Render Blueprint: the API as a free web service (ADR 005). Step-by-step: docs/deployment.md.
# The database is Supabase, not Render: Render's free Postgres expires after 30 days.
services:
  - type: web
    name: detour-api
    runtime: python
    plan: free
    # Pick the Supabase region nearest to this one. A service's region cannot be changed later.
    region: frankfurt
    branch: main
    rootDir: services/api
    buildCommand: pip install .
    # No pre-deploy command on the free plan: start.sh runs the migrations, then the API.
    startCommand: sh start.sh
    healthCheckPath: /v1/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DETOUR_ENVIRONMENT
        value: production
      - key: DETOUR_LOG_LEVEL
        value: INFO
      # Generated by Render on first creation and kept; never stored in the repository.
      - key: DETOUR_TOKEN_SECRET
        generateValue: true
      # The Supabase session-pooler URL; Render asks for it when the Blueprint is created.
      - key: DETOUR_DATABASE_URL
        sync: false
      # Photos (ADR 022): the backend streams the stored photos from Supabase Storage. The service
      # key is a secret: Render asks for it when the Blueprint is synced, or set it in the
      # service's Environment tab. Without them /v1/images answers 503 and the app keeps its
      # illustrations.
      - key: DETOUR_SUPABASE_URL
        sync: false
      - key: DETOUR_SUPABASE_SERVICE_KEY
        sync: false
